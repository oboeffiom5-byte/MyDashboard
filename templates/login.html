<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title><style>
        :root {
            color-scheme: light;
            --ink: #172e2a;
            --muted: #71817c;
            --green: #176b58;
            --green-dark: #105344;
            --line: #dce5df;
            --paper: #fffefa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 32px 18px;
            color: var(--ink);
            background-color: #edf2eb;
            background-image: repeating-linear-gradient(135deg, transparent 0 22px, rgba(23, 107, 88, 0.035) 22px 23px);
            font-family: "DM Sans", "Segoe UI", sans-serif;
        }

        .container {
            width: min(100%, 430px);
            padding: 42px 40px 38px;
            background: var(--paper);
            border: 1px solid rgba(23, 46, 42, 0.08);
            border-radius: 8px;
            box-shadow: 0 24px 70px rgba(28, 54, 45, 0.12), 0 3px 10px rgba(28, 54, 45, 0.04);
            animation: arrive 500ms ease-out both;
        }

        h2 {
            margin-bottom: 9px;
            color: var(--ink);
            font-family: Georgia, "Times New Roman", serif;
            font-size: 32px;
            font-weight: 500;
            text-align: center;
        }

        .subtitle {
            margin-bottom: 32px;
            color: var(--muted);
            font-size: 14px;
            text-align: center;
        }

        .input-group {
            margin-bottom: 19px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #314741;
            font-size: 13px;
            font-weight: 650;
        }

        input {
            width: 100%;
            min-height: 48px;
            padding: 12px 14px;
            border: 1px solid var(--line);
            border-radius: 5px;
            outline: none;
            background: #fff;
            color: var(--ink);
            font: inherit;
            font-size: 14px;
            transition: border-color 160ms ease, box-shadow 160ms ease, background-color 160ms ease;
        }

        input::placeholder {
            color: #9aa8a2;
        }

        input:hover {
            border-color: #a9beb4;
        }

        input:focus {
            border-color: var(--green);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(23, 107, 88, 0.13);
        }

        button {
            width: 100%;
            min-height: 49px;
            margin-top: 5px;
            padding: 13px 16px;
            border: 0;
            border-radius: 5px;
            background: var(--green);
            color: #fff;
            font: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 160ms ease, transform 160ms ease, box-shadow 160ms ease;
        }

        button:hover {
            background: var(--green-dark);
            box-shadow: 0 5px 14px rgba(16, 83, 68, 0.2);
            transform: translateY(-1px);
        }

        button:focus-visible {
            outline: 3px solid rgba(23, 107, 88, 0.35);
            outline-offset: 3px;
        }

        .alert {
            position: fixed;
            z-index: 1;
            top: 20px;
            right: 20px;
            width: min(380px, calc(100% - 36px));
            padding: 15px 18px;
            border: 1px solid #f1c5bd;
            border-left: 4px solid #c4513d;
            border-radius: 5px;
            background: #fff6f3;
            box-shadow: 0 8px 24px rgba(61, 43, 36, 0.1);
            color: #783b30;
            font-size: 14px;
        }

        @keyframes arrive {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 34px 25px 30px;
            }

            h2 {
                font-size: 29px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>

{% with messages = get_flashed_messages()%}
{% if messages %}
    {% for message in messages %}
        <div class="alert">{{message}}</div>
    {% endfor %}
{% endif %}
{% endwith %}

</head><body><div class="container">
    <h2>Create Account</h2>
    <p class="subtitle">Fill in your details to register</p>

    <form method="POST">

        <div class="input-group">
            <label>Username</label>
            <input type="text" name="username" placeholder="Enter your username" >
        </div>

        <div class="input-group">
            <label>Email</label>
            <input type="email" name="email" placeholder="Enter your email" >
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="Enter your password" >
        </div>

        <button type="submit">Register</button>

    </form>
</div>

</body>
</html>
